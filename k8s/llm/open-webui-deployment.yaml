apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # In-cluster DNS name for the ollama Service defined in ollama-service.yaml.
            - name: OLLAMA_BASE_URL
              value: "http://ollama.llm.svc.cluster.local:11434"
            # Disables the "first user becomes admin, open signup" default;
            # flip this only once an account exists if you plan to expose this publicly later.
            - name: WEBUI_AUTH
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
