apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  selector:
    app: open-webui
  # NodePort so any device on your LAN can reach the chat UI directly
  # (e.g. http://172.20.18.60:30880) without going through the public
  # Cloudflare tunnel. Switch to ClusterIP + an Ingress host rule when
  # you're ready to expose this on gitstronaut.com.
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30880
