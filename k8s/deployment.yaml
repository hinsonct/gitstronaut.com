apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitstronaut
  namespace: gitstronaut
  labels:
    app: gitstronaut
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gitstronaut
  template:
    metadata:
      labels:
        app: gitstronaut
    spec:
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: gitstronaut
          image: hinson-server.local:30300/hinsonct/gitstronaut.com:dc3c4beec4e8eb56528c3c16f7682f3db1c0661f
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
