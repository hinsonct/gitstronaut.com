apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitstronaut
  namespace: gitstronaut
spec:
  ingressClassName: traefik
  rules:
    - host: gitstronaut.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitstronaut
                port:
                  number: 80
    # Temporary, for pre-cutover validation while gitstronaut.com still points at Vercel.
    # Remove once the apex DNS record is switched to the tunnel.
    - host: test.gitstronaut.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitstronaut
                port:
                  number: 80
